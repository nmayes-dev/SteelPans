name: Redeploy Pans

on:
  push:
    branches:
      - master
      - develop

jobs:
  redeploy:
    runs-on: [self-hosted, home-server]

    steps:
      - name: Deploy Prod
        if: github.ref == 'refs/heads/master'
        run: |
          cd "$PANS_DEPLOY_PATH"
          ./restart.sh prod
        env:
          PANS_DEPLOY_PATH: ${{ vars.PANS_DEPLOY_PATH }}

      - name: Deploy Dev
        if: github.ref == 'refs/heads/develop'
        run: |
          cd "$PANS_DEPLOY_PATH"
          ./restart.sh dev
        env:
          PANS_DEPLOY_PATH: ${{ vars.PANS_DEPLOY_PATH }}
